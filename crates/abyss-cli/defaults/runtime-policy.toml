schema_version = 1

[mitm.tls_decryption]
default_action = "passthrough"
missing_sni_action = "passthrough"

[[mitm.tls_decryption.rules]]
id = "passthrough-openai-support-services"
enabled = true
action = "passthrough"
destination_hosts = ["ab.chatgpt.com"]

[[mitm.tls_decryption.rules]]
id = "decrypt-openai-chatgpt"
enabled = true
action = "intercept"
destination_hosts = ["openai.com", "*.openai.com", "chatgpt.com", "*.chatgpt.com"]

[[mitm.tls_decryption.rules]]
id = "decrypt-anthropic-claude"
enabled = true
action = "intercept"
destination_hosts = ["anthropic.com", "*.anthropic.com", "claude.ai", "*.claude.ai"]

[[mitm.tls_decryption.rules]]
id = "decrypt-deepseek-api"
enabled = true
action = "intercept"
destination_hosts = ["api.deepseek.com"]

[[mitm.tls_decryption.rules]]
id = "decrypt-glm-api"
enabled = true
action = "intercept"
destination_hosts = ["open.bigmodel.cn", "api.z.ai"]

[[mitm.tls_decryption.rules]]
id = "decrypt-kimi-api"
enabled = true
action = "intercept"
destination_hosts = ["api.moonshot.cn", "api.moonshot.ai"]

[[mitm.tls_decryption.rules]]
id = "decrypt-qwen-api"
enabled = true
action = "intercept"
destination_hosts = [
    "dashscope.aliyuncs.com",
    "dashscope-intl.aliyuncs.com",
    "dashscope-us.aliyuncs.com",
    "coding.dashscope.aliyuncs.com",
    "coding-intl.dashscope.aliyuncs.com",
    "*.cn-beijing.maas.aliyuncs.com",
    "*.ap-southeast-1.maas.aliyuncs.com",
    "*.us-east-1.maas.aliyuncs.com",
    "*.eu-central-1.maas.aliyuncs.com",
    "*.ap-northeast-1.maas.aliyuncs.com",
    "*.cn-hongkong.maas.aliyuncs.com",
]

[hooks.harness_usage]
enabled = true

[hooks.harness_usage.config.content]
token_usage = true
conversation_text = true
tool_calls = true
images = true

[hooks.harness_usage.config.harnesses.codex]
enabled = true

[hooks.harness_usage.config.harnesses.codex.content]
token_usage = true
conversation_text = true
tool_calls = true
images = true

[hooks.harness_usage.config.harnesses."claude-code"]
enabled = true

[hooks.harness_usage.config.harnesses."claude-code".content]
token_usage = true
conversation_text = true
tool_calls = true
images = true

[hooks.harness_usage.config.harnesses."claude-desktop"]
enabled = true

[hooks.harness_usage.config.harnesses."claude-desktop".content]
token_usage = true
conversation_text = true
tool_calls = true
images = true

# DSH's headless, TUI, and Web clients use the built-in Harness detector.
[hooks.harness_usage.config.harnesses."deepseek-harness"]
enabled = true
