[package]
name = "abyss-broker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
abyss-agent-hook.workspace = true
abyss-mitm.workspace = true
abyss-plugin-protocol.workspace = true
abyss-storage.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
diesel = { version = "2.2", default-features = false, features = ["sqlite", "32-column-tables"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
parking_lot.workspace = true
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.72"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }

[[bin]]
name = "abyss-broker"
path = "src/main.rs"

[lints]
workspace = true
