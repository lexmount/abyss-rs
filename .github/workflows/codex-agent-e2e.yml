name: Codex Agent-driven E2E

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Space-separated existing run-attempt IDs to inspect
        required: true
        type: string

concurrency:
  group: agent-e2e-diagnostics-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostics:
    name: Inspect retained Codex diagnostics
    runs-on: [self-hosted, abyss, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test diagnostic redaction
        run: python3 -m unittest discover -s scripts/tests -p 'test_codex_retained_diagnostics.py'
      - name: Read existing evidence without model requests
        env:
          DIAGNOSTIC_RUN_IDS: ${{ inputs.run_ids }}
        run: python3 scripts/codex_retained_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: codex-retained-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-retained-diagnostics.json
          retention-days: 3
          if-no-files-found: error
