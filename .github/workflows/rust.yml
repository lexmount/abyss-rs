name: Temporary DSH transport diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: agent-e2e
      - name: Isolate message_stop versus HTTP terminator
        run: cargo test --locked --package abyss-mitm diagnostic_message_stop_split_terminator -- --nocapture
