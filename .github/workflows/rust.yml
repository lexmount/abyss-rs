name: Rust

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Rust style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Check rustfmt
        run: cargo +nightly fmt --all -- --check

  build:
    name: Rust build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - [self-hosted, abyss, macOS, ARM64]
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        if: runner.os != 'macOS'
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache Rust build outputs
        if: runner.os != 'macOS'
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          cache-on-failure: true

      - name: Configure macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          clang_bin="$(xcrun --find clang)"
          libclang_dir="$(cd "$(dirname "$clang_bin")/../lib" && pwd)"
          echo "LIBCLANG_PATH=$libclang_dir" >> "$GITHUB_ENV"

      - name: Install Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clang = Join-Path $llvmBin "clang.exe"
          if (-not (Test-Path -Path $clang -PathType Leaf)) {
            choco install llvm --version 18.1.8 --no-progress -y
          }
          if (-not (Test-Path -Path $clang -PathType Leaf)) {
            throw "LLVM was not found at $clang after installation."
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Select supported Rust packages
        shell: bash
        run: |
          packages=(
            --package abyss-agent-hook
            --package abyss-broker
            --package abyss-delivery-plugin
            --package abyss-mitm
            --package abyss-plugin-protocol
            --package abyss-sdk
            --package abyss-storage
            --package abyss-terminal-auth
          )
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            packages+=(--package abyss-cli)
          fi
          printf '%s\n' "${packages[@]}" > "$RUNNER_TEMP/abyss-packages"

      - name: Build Rust packages
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < "$RUNNER_TEMP/abyss-packages"
          cargo build --locked "${packages[@]}"

      - name: Run Rust tests
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < "$RUNNER_TEMP/abyss-packages"
          cargo test --locked "${packages[@]}" -- \
            --skip broker_loads_current_toml_config_with_relative_paths_and_devtools_controls

      - name: Run broker static configuration black-box
        shell: bash
        run: |
          test_name=broker_loads_current_toml_config_with_relative_paths_and_devtools_controls
          test_count="$(cargo test --locked \
            --package abyss-broker \
            --test broker_cli_blackbox \
            "${test_name}" \
            -- --exact --list \
            | tr -d '\r' \
            | grep -Fxc "${test_name}: test")"
          test "${test_count}" -eq 1
          cargo test --locked \
            --package abyss-broker \
            --test broker_cli_blackbox \
            "${test_name}" \
            -- --exact --nocapture

      - name: Run broker config API black-box
        if: runner.os == 'macOS'
        run: make test-blackbox-broker-config-api

      - name: Run custom Harness event black-box
        if: runner.os == 'macOS'
        run: |
          cargo test --locked \
            --package abyss-broker \
            --test broker_cli_blackbox \
            custom_harness_emits_events_through_real_broker_flow_and_plugin_boundaries \
            -- --exact --nocapture

      - name: Run broker explicit proxy black-box
        if: runner.os == 'Linux'
        run: make test-blackbox-broker-explicit

      - name: Validate Linux systemd service template
        if: runner.os == 'Linux'
        run: |
          service_file="$RUNNER_TEMP/abyss-broker@test.service"
          sed "s#/usr/local/bin/abyss-broker#${PWD}/target/debug/abyss-broker#" \
            platform/linux/abyss-broker@.service > "$service_file"
          systemd-analyze verify "$service_file"
          bash scripts/tests/test_linux_service_unit.sh "$service_file"

      - name: Run endpoint distribution contract tests
        if: runner.os == 'Linux'
        run: python3 scripts/tests/test_backend_image_contract.py

      - name: Run macOS CA trust black-box
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: make test-blackbox-macos-ca

      - name: Run clippy
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do packages+=("$package"); done < "$RUNNER_TEMP/abyss-packages"
          cargo clippy --locked --all-targets "${packages[@]}" -- -D warnings

  sdk:
    name: Multi-language SDK and real broker black-box
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          cache-on-failure: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install SDK toolchains
        run: |
          npm --prefix sdks/typescript ci
          python -m pip install --disable-pip-version-check './sdks/python[dev]'

      - name: Run SDK unit and real broker black-box tests
        run: make test-sdks
