name: Claude Code Black-box

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-code-upload:
    name: Real Claude Code context upload
    runs-on: ubuntu-latest
    concurrency:
      group: abyss-e2e-provider-deepseek
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: claude-code-upload-blackbox

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code CLI
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.209
          claude --version

      - name: Run Claude Code usage upload black-box
        timeout-minutes: 15
        env:
          CLAUDE_CODE_API_KEY: ${{ secrets.ABYSS_E2E_DEEPSEEK_API_KEY }}
          CLAUDE_CODE_BASE_URL: https://api.deepseek.com/anthropic
          CLAUDE_CODE_MODEL: deepseek-flash
        run: |
          : "${CLAUDE_CODE_API_KEY:?ABYSS_E2E_DEEPSEEK_API_KEY Actions secret is required}"
          exec scripts/blackbox_claude_code_usage_upload.sh
