name: Release endpoint binaries

on:
  pull_request:
    paths:
      - '.github/workflows/cli-release.yml'
      - 'scripts/install.sh'
      - 'scripts/ci/package_cli.py'
      - 'scripts/ci/verify_release.py'
      - 'scripts/ci/assemble_release.py'
      - 'scripts/ci/package_broker.py'
      - 'scripts/ci/package_query.py'
      - 'scripts/ci/publish_cos.py'
      - 'scripts/tests/*release*'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'platform/linux/abyss-broker@.service'
      - 'LICENSE'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Hold one lock across version uploads, latest promotion, and GitHub publish.
  group: cli-release-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'publication' || github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  TENCENT_COSCLI_URL: https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
  TENCENT_COSCLI_SHA256: a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Package endpoint (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake pkg-config clang libclang-dev
          # Use musl-gcc for C dependencies, but keep Rust's default linker:
          # Ubuntu 22.04's musl-gcc wrapper breaks static PIE startup.
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
      - name: Configure macOS build tools
        if: runner.os == 'macOS'
        run: |
          clang_bin="$(xcrun --find clang)"
          libclang_dir="$(cd "$(dirname "$clang_bin")/../lib" && pwd)"
          echo "LIBCLANG_PATH=$libclang_dir" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
      - name: Configure Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clang = Join-Path $llvmBin "clang.exe"
          if (-not (Test-Path -Path $clang -PathType Leaf)) {
            choco install llvm --version 18.1.8 --no-progress -y
          }
          if (-not (Test-Path -Path $clang -PathType Leaf)) {
            throw "LLVM was not found at $clang after installation."
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Rust
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$CLI_TARGET"
      - name: Test release packaging and assembly
        run: |
          python scripts/tests/test_release_artifacts.py
          python scripts/tests/test_release_query.py
          python scripts/tests/test_release_cos.py
      - name: Test piped download installer
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/install.sh
          python3 scripts/tests/test_release_installer.py
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: cli-release-${{ matrix.target }}
      - name: Build release binaries
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          packages=(-p abyss-broker -p abyss-delivery-plugin -p abyss-query-cli)
          if [[ "$RUNNER_OS" != Windows ]]; then
            packages+=(-p abyss-cli)
          fi
          cargo build --release --locked --target "$CLI_TARGET" "${packages[@]}"
      - name: Package and validate release version
        env:
          CLI_TARGET: ${{ matrix.target }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            args+=(--tag "$RELEASE_REF_NAME")
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(--variant runtime)
          fi
          python scripts/ci/package_cli.py --target "$CLI_TARGET" \
            --binaries "target/$CLI_TARGET/release" --output dist "${args[@]}"
          cat dist/SHA256SUMS.* > dist/SHA256SUMS
      - name: Package and smoke-test standalone query CLI
        env:
          CLI_TARGET: ${{ matrix.target }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            args+=(--tag "$RELEASE_REF_NAME")
          fi
          python scripts/ci/package_query.py package --target "$CLI_TARGET" \
            --binaries "target/$CLI_TARGET/release" --output query-dist "${args[@]}"
          shopt -s nullglob
          python scripts/ci/package_query.py verify --smoke query-dist/*.tar.gz query-dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: query-build-${{ matrix.target }}
          path: query-dist/*
          if-no-files-found: error
      - name: Verify installed release binaries
        if: runner.os != 'Windows'
        run: sh scripts/tests/smoke_release_install.sh dist
      - name: Build and package CLI without local deployment
        if: runner.os != 'Windows'
        env:
          CLI_TARGET: ${{ matrix.target }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          # The default CLI is already archived. Only rebuild the CLI; retain the
          # same broker and delivery executables for both distribution variants.
          cargo build --release --locked --target "$CLI_TARGET" \
            -p abyss-cli --no-default-features
          args=()
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            args+=(--tag "$RELEASE_REF_NAME")
          fi
          python scripts/ci/package_cli.py --target "$CLI_TARGET" \
            --binaries "target/$CLI_TARGET/release" --output dist \
            --variant no-local "${args[@]}"
      - name: Verify archive metadata and native executables
        run: |
          shopt -s nullglob
          python scripts/ci/verify_release.py --smoke dist/*.tar.gz dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-build-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/SHA256SUMS.*
          if-no-files-found: error

  assemble:
    name: Validate complete endpoint release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: endpoint-build-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: query-build-*
          path: query-artifacts
      - name: Assemble complete release
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python scripts/ci/assemble_release.py --artifacts artifacts \
            --output dist --revision "$RELEASE_REVISION"
          python scripts/ci/package_broker.py --release dist \
            --output broker-dist --revision "$RELEASE_REVISION"
          python scripts/ci/package_query.py assemble --artifacts query-artifacts \
            --output abyss-query-dist --revision "$RELEASE_REVISION"
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-release
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: broker-release
          path: broker-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-query-release
          path: abyss-query-dist/*
          if-no-files-found: error

  publish-cdn:
    name: Publish ${{ matrix.component }} to ${{ matrix.site }} CDN origin
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [assemble, stage-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        site: [CN, COM]
        component: [broker, abyss-query]
    env:
      TENCENT_COS_BUCKET: ${{ vars[format('TENCENT_COS_{0}_BUCKET', matrix.site)] }}
      TENCENT_COS_REGION: ${{ vars[format('TENCENT_COS_{0}_REGION', matrix.site)] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.component }}-release
          path: cdn-dist
      - name: Install verified Tencent COSCLI
        run: |
          coscli="$RUNNER_TEMP/coscli"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --output "$coscli" "$TENCENT_COSCLI_URL"
          echo "$TENCENT_COSCLI_SHA256  $coscli" | sha256sum --check --strict -
          chmod 700 "$coscli"
          echo "TENCENT_COSCLI_BIN=$coscli" >> "$GITHUB_ENV"
      - name: Upload component archives and checksums
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMPONENT: ${{ matrix.component }}
        run: |
          python scripts/ci/publish_cos.py --component "$RELEASE_COMPONENT" --source cdn-dist \
            --tag "$RELEASE_TAG" --coscli "$TENCENT_COSCLI_BIN"

  stage-release:
    name: Stage complete endpoint release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: endpoint-release
          path: dist
      - name: Verify release checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS
      - name: Upload assets before publishing latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2> release-error.log; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Abyss $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/install.sh dist/SHA256SUMS dist/*.tar.gz dist/*.zip --clobber

  publish:
    name: Promote CDN latest manifests and publish endpoint release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [stage-release, publish-cdn]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: broker-release
          path: broker-dist
      - uses: actions/download-artifact@v4
        with:
          name: abyss-query-release
          path: abyss-query-dist
      - name: Install verified Tencent COSCLI
        run: |
          coscli="$RUNNER_TEMP/coscli"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 3 --output "$coscli" "$TENCENT_COSCLI_URL"
          echo "$TENCENT_COSCLI_SHA256  $coscli" | sha256sum --check --strict -
          chmod 700 "$coscli"
          echo "TENCENT_COSCLI_BIN=$coscli" >> "$GITHUB_ENV"
      - name: Read published versions before promoting latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > published-tags.txt
      - name: Promote latest manifests after every component is ready on both origins
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENT_COS_CN_BUCKET: ${{ vars.TENCENT_COS_CN_BUCKET }}
          TENCENT_COS_CN_REGION: ${{ vars.TENCENT_COS_CN_REGION }}
          TENCENT_COS_COM_BUCKET: ${{ vars.TENCENT_COS_COM_BUCKET }}
          TENCENT_COS_COM_REGION: ${{ vars.TENCENT_COS_COM_REGION }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for site in CN COM; do
            bucket_var="TENCENT_COS_${site}_BUCKET"
            region_var="TENCENT_COS_${site}_REGION"
            for component in broker abyss-query; do
              TENCENT_COS_BUCKET="${!bucket_var}" TENCENT_COS_REGION="${!region_var}" \
                python scripts/ci/publish_cos.py --component "$component" --source "$component-dist" \
                  --tag "$RELEASE_TAG" --coscli "$TENCENT_COSCLI_BIN" \
                  --latest-only --published-tags published-tags.txt
            done
          done
      - name: Publish GitHub latest after all manifests are ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
