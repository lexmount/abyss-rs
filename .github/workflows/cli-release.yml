name: Release endpoint binaries

on:
  pull_request:
    paths:
      - '.github/workflows/cli-release.yml'
      - 'scripts/install.sh'
      - 'scripts/ci/package_cli.py'
      - 'scripts/ci/verify_release.py'
      - 'scripts/ci/assemble_release.py'
      - 'scripts/tests/*release*'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'platform/linux/abyss-broker@.service'
      - 'LICENSE'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Package endpoint (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake pkg-config clang libclang-dev
          # Use musl-gcc for C dependencies, but keep Rust's default linker:
          # Ubuntu 22.04's musl-gcc wrapper breaks static PIE startup.
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
      - name: Configure macOS build tools
        if: runner.os == 'macOS'
        run: |
          clang_bin="$(xcrun --find clang)"
          libclang_dir="$(cd "$(dirname "$clang_bin")/../lib" && pwd)"
          echo "LIBCLANG_PATH=$libclang_dir" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
      - name: Configure Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $llvmBin = "C:\Program Files\LLVM\bin"
          $clang = Join-Path $llvmBin "clang.exe"
          if (-not (Test-Path -Path $clang -PathType Leaf)) {
            choco install llvm --version 18.1.8 --no-progress -y
          }
          if (-not (Test-Path -Path $clang -PathType Leaf)) {
            throw "LLVM was not found at $clang after installation."
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install Rust
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$CLI_TARGET"
      - name: Test release packaging and assembly
        run: python scripts/tests/test_release_artifacts.py
      - name: Test piped download installer
        if: runner.os != 'Windows'
        run: |
          sh -n scripts/install.sh
          python3 scripts/tests/test_release_installer.py
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          shared-key: cli-release-${{ matrix.target }}
      - name: Build release binaries
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          packages=(-p abyss-broker -p abyss-delivery-plugin)
          if [[ "$RUNNER_OS" != Windows ]]; then
            packages+=(-p abyss-cli)
          fi
          cargo build --release --locked --target "$CLI_TARGET" "${packages[@]}"
      - name: Package and validate release version
        env:
          CLI_TARGET: ${{ matrix.target }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            args+=(--tag "$RELEASE_REF_NAME")
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(--variant runtime)
          fi
          python scripts/ci/package_cli.py --target "$CLI_TARGET" \
            --binaries "target/$CLI_TARGET/release" --output dist "${args[@]}"
          cat dist/SHA256SUMS.* > dist/SHA256SUMS
      - name: Verify installed release binaries
        if: runner.os != 'Windows'
        run: sh scripts/tests/smoke_release_install.sh dist
      - name: Build and package CLI without local deployment
        if: runner.os != 'Windows'
        env:
          CLI_TARGET: ${{ matrix.target }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          # The default CLI is already archived. Only rebuild the CLI; retain the
          # same broker and delivery executables for both distribution variants.
          cargo build --release --locked --target "$CLI_TARGET" \
            -p abyss-cli --no-default-features
          args=()
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            args+=(--tag "$RELEASE_REF_NAME")
          fi
          python scripts/ci/package_cli.py --target "$CLI_TARGET" \
            --binaries "target/$CLI_TARGET/release" --output dist \
            --variant no-local "${args[@]}"
      - name: Verify archive metadata and native executables
        run: |
          shopt -s nullglob
          python scripts/ci/verify_release.py --smoke dist/*.tar.gz dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-build-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/SHA256SUMS.*
          if-no-files-found: error

  assemble:
    name: Validate complete endpoint release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: endpoint-build-*
          path: artifacts
      - name: Assemble complete release
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          python scripts/ci/assemble_release.py --artifacts artifacts \
            --output dist --revision "$RELEASE_REVISION"
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish complete endpoint release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cli-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: endpoint-release
          path: dist
      - name: Verify release checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS
      - name: Upload assets before publishing latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2> release-error.log; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Abyss $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/install.sh dist/SHA256SUMS dist/*.tar.gz dist/*.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
