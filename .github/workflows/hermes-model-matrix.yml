name: Hermes Model Matrix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      provider:
        description: Optional provider filter (openai, anthropic, deepseek, glm, kimi, qwen)
        type: string
      protocol:
        description: Optional protocol filter (responses, chat, messages)
        type: string
      model:
        description: Optional exact model filter
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Hermes
    uses: ./.github/workflows/agent-model-matrix.yml
    with:
      harness: hermes
      provider: ${{ inputs.provider || '' }}
      protocol: ${{ inputs.protocol || '' }}
      model: ${{ inputs.model || '' }}
    secrets: inherit
