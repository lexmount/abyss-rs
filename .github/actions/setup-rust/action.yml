name: Setup Rust
description: Use the preconfigured macOS Rust toolchain or install Rust elsewhere, then restore cached build outputs.

inputs:
  cache-shared-key:
    description: Workload-specific key used to isolate Rust build caches.
    required: true

runs:
  using: composite
  steps:
    - name: Add Rust to PATH
      if: runner.os != 'macOS'
      shell: bash
      run: bash scripts/ci/ensure_rustup.sh

    - name: Install Rust
      if: runner.os != 'macOS'
      shell: bash
      run: rustup toolchain install stable --profile minimal

    - name: Cache Rust build outputs
      if: runner.os != 'macOS'
      uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      with:
        cache-on-failure: true
        shared-key: ${{ inputs.cache-shared-key }}
