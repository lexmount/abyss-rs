name: Set up Codex sandbox
description: Enable the distribution bubblewrap sandbox on Ubuntu and verify it without API calls.

runs:
  using: composite
  steps:
    - name: Install bubblewrap and its AppArmor profile
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
        profile=/etc/apparmor.d/bwrap-userns-restrict
        if [[ ! -f "$profile" ]]; then
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict "$profile"
        fi
        sudo apparmor_parser -r "$profile"

    - name: Check Codex sandbox before provider traffic
      shell: bash
      run: bash scripts/ci/check_codex_sandbox.sh
