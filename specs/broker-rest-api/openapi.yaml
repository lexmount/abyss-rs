openapi: 3.1.0
info:
  title: Abyss Broker REST API
  version: 1.0.0
  description: >-
    Loopback-only management API exposed by abyss-broker. This controls local
    broker state; it is not the remote Abyss backend API and never accepts
    event-delivery or SSO credentials.
servers:
  - url: http://127.0.0.1:18190
    description: Example local broker endpoint
security:
  - localBearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Broker process health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/proxy/status:
    get:
      operationId: getProxyStatus
      security: []
      responses:
        "200":
          description: Current proxy lifecycle and ingress endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyStatus"
  /v1/mitm/config:
    get:
      operationId: getMitmConfig
      responses:
        "200":
          description: Current TLS decryption policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MitmConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateMitmConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MitmConfig"
      responses:
        "200":
          description: Durably committed TLS decryption policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MitmConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/hooks/config:
    get:
      operationId: getHooksConfig
      responses:
        "200":
          description: Current Harness usage policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HooksConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateHooksConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HooksConfig"
      responses:
        "200":
          description: Durably committed Harness usage policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HooksConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/support/logs/broker:
    post:
      operationId: collectBrokerLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerLogRequest"
      responses:
        "200":
          description: Bounded broker-owned log content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerLogResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/support/diagnostics:
    get:
      operationId: getDiagnostics
      responses:
        "200":
          description: Metadata-only broker and flow diagnostics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/network/observations:
    get:
      operationId: getNetworkObservations
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Newest durable technical network observations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkObservationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/traffic/snapshot:
    get:
      operationId: getTrafficSnapshot
      responses:
        "200":
          description: Ephemeral metadata-only live traffic snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/broker/shutdown:
    post:
      operationId: shutdownBroker
      responses:
        "200":
          description: Stopped proxy status. The broker exits after responding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    localBearer:
      type: http
      scheme: bearer
      description: Per-process token read from the broker auth-token file.
  responses:
    Unauthorized:
      description: Missing or invalid local bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request or runtime policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: abyss-broker
        status:
          const: ok
    ProxyStatus:
      type: object
      additionalProperties: false
      required: [lifecycle, process_id, mode, ingresses, listen_addr]
      properties:
        lifecycle:
          enum: [running, stopped]
        process_id:
          type: integer
          minimum: 1
        mode:
          oneOf:
            - enum: [explicit, transparent]
            - type: "null"
        ingresses:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/IngressStatus"
        listen_addr:
          oneOf:
            - type: string
            - type: "null"
        socket_path:
          type: string
    IngressStatus:
      type: object
      additionalProperties: false
      required: [source, listen_addr]
      properties:
        source:
          enum: [explicit_http, macos_network_extension, windows_wfp]
        listen_addr:
          oneOf:
            - type: string
            - type: "null"
        socket_path:
          type: string
    MitmConfig:
      type: object
      additionalProperties: false
      required: [tls_decryption]
      properties:
        tls_decryption:
          $ref: "#/components/schemas/TlsDecryptionPolicy"
    TlsDecryptionPolicy:
      type: object
      additionalProperties: false
      required: [default_action, missing_sni_action, rules]
      properties:
        default_action:
          $ref: "#/components/schemas/TlsDecryptionAction"
        missing_sni_action:
          oneOf:
            - $ref: "#/components/schemas/TlsDecryptionAction"
            - type: "null"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/TlsDecryptionRule"
    TlsDecryptionAction:
      enum: [intercept, passthrough]
    TlsDecryptionRule:
      type: object
      additionalProperties: false
      required: [id, enabled, action, destination_hosts]
      properties:
        id:
          type: string
          minLength: 1
        enabled:
          type: boolean
        action:
          $ref: "#/components/schemas/TlsDecryptionAction"
        process_names:
          type: array
          items:
            type: string
            minLength: 1
        application_ids:
          type: array
          items:
            type: string
            minLength: 1
        destination_hosts:
          type: array
          items:
            type: string
            minLength: 1
    HooksConfig:
      type: object
      additionalProperties: false
      required: [harness_usage]
      properties:
        harness_usage:
          $ref: "#/components/schemas/HarnessUsageHookConfig"
    HarnessUsageHookConfig:
      type: object
      additionalProperties: false
      required: [enabled, config]
      properties:
        enabled:
          type: boolean
        config:
          $ref: "#/components/schemas/HarnessUsageConfig"
    HarnessUsageConfig:
      type: object
      additionalProperties: false
      required: [content, harnesses]
      properties:
        content:
          $ref: "#/components/schemas/HarnessUsageContentConfig"
        harnesses:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HarnessConfig"
    HarnessConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        content:
          $ref: "#/components/schemas/HarnessUsageContentConfig"
        matchers:
          type: array
          items:
            $ref: "#/components/schemas/HarnessMatcherConfig"
    HarnessMatcherConfig:
      type: object
      additionalProperties: false
      properties:
        process_names:
          type: array
          items:
            type: string
        application_ids:
          type: array
          items:
            type: string
    HarnessUsageContentConfig:
      type: object
      additionalProperties: false
      required: [token_usage, conversation_text, tool_calls, images]
      properties:
        token_usage:
          type: boolean
        conversation_text:
          type: boolean
        tool_calls:
          type: boolean
        images:
          type: boolean
    BrokerLogRequest:
      type: object
      additionalProperties: false
      properties:
        max_bytes_per_file:
          type: integer
          minimum: 1
          maximum: 67108864
    BrokerLogResponse:
      type: object
      additionalProperties: false
      required: [files, errors]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/BrokerLogFile"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/BrokerLogError"
    BrokerLogFile:
      type: object
      additionalProperties: false
      required: [name, content, truncated, original_size]
      properties:
        name:
          type: string
        content:
          type: string
        truncated:
          type: boolean
        original_size:
          type: integer
          minimum: 0
    BrokerLogError:
      type: object
      additionalProperties: false
      required: [name, error]
      properties:
        name:
          type: string
        error:
          type: string
    DiagnosticsSnapshot:
      type: object
      description: >-
        Versioned metadata-only diagnostic snapshot. Consumers should branch
        on schema_version before depending on nested diagnostic details.
      required: [schema_version, collected_at_unix_ms, broker, proxy, flow]
      properties:
        schema_version:
          type: integer
          minimum: 1
        collected_at_unix_ms:
          type: integer
          minimum: 0
        broker:
          type: object
        proxy:
          $ref: "#/components/schemas/ProxyStatus"
        flow:
          type: object
    NetworkObservationsResponse:
      type: object
      additionalProperties: false
      required: [schema_version, broker_started_at_unix_ms, observations]
      properties:
        schema_version:
          const: 1
        broker_started_at_unix_ms:
          type: integer
          minimum: 0
        observations:
          type: array
          items:
            type: object
            description: Metadata-only technical observation.
    TrafficSnapshot:
      type: object
      additionalProperties: false
      required:
        - sampled_at_unix_ms
        - upload_bytes_per_second
        - download_bytes_per_second
        - total_upload_bytes
        - total_download_bytes
        - active_flows
      properties:
        sampled_at_unix_ms:
          type: integer
          minimum: 0
        upload_bytes_per_second:
          type: integer
          minimum: 0
        download_bytes_per_second:
          type: integer
          minimum: 0
        total_upload_bytes:
          type: integer
          minimum: 0
        total_download_bytes:
          type: integer
          minimum: 0
        active_flows:
          type: array
          items:
            $ref: "#/components/schemas/ActiveFlow"
    ActiveFlow:
      type: object
      additionalProperties: false
      required: [id, host, upload_bytes, download_bytes]
      properties:
        id:
          type: string
        host:
          type: string
        process:
          type: string
        pid:
          type: integer
          minimum: 1
        upload_bytes:
          type: integer
          minimum: 0
        download_bytes:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
